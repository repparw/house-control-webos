<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>House Control for webOS</title><script>try{var m=localStorage.getItem('house-control:webos:theme:v1')||'oled';if(m!=='oled'&&m!=='light'&&m!=='auto')m='oled';document.documentElement.dataset.appearance=m;var t=m==='light'||(m==='auto'&&matchMedia('(prefers-color-scheme: light)').matches)?'day':'oled';document.documentElement.dataset.theme=t;document.querySelector('meta[name="theme-color"]').content=t==='day'?'#e9eaed':'#000000'}catch(e){}</script></head><body><div id="app"><div class="boot" role="status" aria-label="Opening your home"></div></div><script type="module" src="/src/main.js"></script></body></html>
